name: Atualizar base de animes

on:
  workflow_dispatch:            # botão "Run workflow" na aba Actions
    inputs:
      delay:
        description: "Pausa entre pedidos (segundos)"
        default: "1"
      workers:
        description: "Pedidos em paralelo (3 é um valor educado)"
        default: "3"
      max_animes:
        description: "Limite de títulos por fase (0 = todos; use 5 para testar)"
        default: "0"
      match:
        description: "Só títulos cujo nome combine com este texto/regex (vazio = todos)"
        default: ""
      modo:
        description: "completo = tudo | catalogo = listas+sinopses (sem links) | links = só links dos episódios"
        type: choice
        options: [completo, catalogo, links]
        default: completo
  schedule:
    - cron: "0 3 * * 1"         # toda segunda às 03:00 UTC

permissions:
  contents: write               # para guardar animes_db.json no repositório
  actions: write                # para o workflow se re-executar quando o tempo acaba

concurrency:
  group: animes-db              # nunca duas execuções ao mesmo tempo
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 360        # limite máximo de um job no GitHub
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rodar o extrator (retoma de onde parou)
        id: run
        env:
          DELAY: ${{ github.event.inputs.delay || '1' }}
          WORKERS: ${{ github.event.inputs.workers || '3' }}
          MAX_ANIMES: ${{ github.event.inputs.max_animes || '0' }}
          MATCH: ${{ github.event.inputs.match || '' }}
          MODO: ${{ github.event.inputs.modo || 'completo' }}
        run: |
          FASES=123
          [ "$MODO" = "catalogo" ] && FASES=12
          [ "$MODO" = "links" ] && FASES=3
          EXTRA=()
          [ -n "$MATCH" ] && EXTRA+=(--match "$MATCH")
          # para 20 min antes do limite, para dar tempo de guardar o resultado
          set +e
          timeout 340m python animes.py db \
            -o animes_db.json --delay "$DELAY" --workers "$WORKERS" \
            --max-animes "$MAX_ANIMES" --fases "$FASES" "${EXTRA[@]}"
          CODE=$?
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          # 124 = acabou o tempo (normal em sites grandes); outro erro != 0 falha o job
          [ "$CODE" -eq 0 ] || [ "$CODE" -eq 124 ]

      - name: Guardar a base no repositório
        if: always()
        run: |
          [ -f animes_db.json ] || exit 0
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add animes_db.json
          git diff --cached --quiet && { echo "Sem mudanças."; exit 0; }
          TOTAL=$(python -c "import json;d=json.load(open('animes_db.json'));print(d['total_animes'],'animes,',d['total_links'],'/',d['total_episodios'],'links')")
          git commit -m "Atualiza base de animes ($TOTAL)"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push

      - name: Guardar também como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: animes_db
          path: animes_db.json
          if-no-files-found: ignore

      - name: Continuar numa nova execução se o tempo acabou
        if: steps.run.outputs.code == '124'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Tempo esgotado: a lançar nova execução para continuar."
          gh workflow run "${{ github.workflow }}" --ref "${GITHUB_REF_NAME}" \
            -f modo="${{ github.event.inputs.modo || 'completo' }}" \
            -f delay="${{ github.event.inputs.delay || '1' }}" \
            -f workers="${{ github.event.inputs.workers || '3' }}" \
            -f max_animes="${{ github.event.inputs.max_animes || '0' }}" \
            -f match="${{ github.event.inputs.match || '' }}"
