name: Atualizar nomes dos animes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nomes:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Atualizar nomes
        run: python atualizar_nomes.py

      - name: Guardar resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add animes_leve.json nomes_cache.json nomes_revisar.txt
          git diff --staged --quiet || git commit -m "Atualiza nomes dos animes"
          git push
