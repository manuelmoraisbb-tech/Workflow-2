name: Extrair zip
on:
  workflow_dispatch:
    inputs:
      zip:
        description: "Caminho do zip no repositório"
        default: "MB-Animes-App.zip"
      limpar:
        description: "Apagar app/ e gradle/ antes de extrair"
        type: boolean
        default: true
  push:
    paths: ["*.zip"]

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    env:
      HAS_PAT: ${{ secrets.PAT != '' }}
      ZIP: ${{ inputs.zip || 'MB-Animes-App.zip' }}
      LIMPAR: ${{ inputs.limpar == false && 'nao' || 'sim' }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT || github.token }}

      - name: Extrair tudo na raiz
        run: |
          test -f "$ZIP" || { echo "Não encontrei $ZIP"; exit 1; }
          rm -rf /tmp/x && mkdir -p /tmp/x
          unzip -q "$ZIP" -d /tmp/x

          echo "--- O que veio dentro do zip ---"
          ls -la /tmp/x

          # Se o zip vier com UMA pasta só dentro, entra nela
          # Ex: MB-Animes-App/app -> vira só app
          SRC=/tmp/x
          if [ "$(ls -A "$SRC" | wc -l)" = "1" ] && [ -d "$SRC/$(ls -A "$SRC")" ]; then
            SRC="$SRC/$(ls -A "$SRC")"
            echo "Pasta interna detetada, a extrair o conteúdo de: $SRC"
          fi

          ls -la "$SRC"

          if [ "$HAS_PAT" != "true" ]; then
            rm -rf "$SRC/.github"
          fi

          cd "$GITHUB_WORKSPACE"
          if [ "$LIMPAR" = "sim" ]; then
            rm -rf app gradle .androidide
          fi

          # O segredo está aqui: "$SRC/." copia o CONTEÚDO, não a pasta
          cp -a "$SRC/." .
          rm -f "$ZIP"

          echo "--- Como ficou na raiz ---"
          ls -la

      - name: Commit e push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "Nada para commitar"; exit 0; }
          git commit -m "Extrair $ZIP"
          git push
